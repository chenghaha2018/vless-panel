# 高级用法模板: 服务器的 443 已经由 nginx stream 按 SNI 分流 (ssl_preread + proxy_protocol) 时,
# 让面板也走 443。普通服务器直接用 install.sh --domain 即可, 不需要这个文件。
#
# 替换: panel.example.com -> 你的面板域名
#       PANEL_PORT        -> /etc/vless-panel/panel.json 里的 port
#       8446              -> 本机一个空闲端口
# 放到 /etc/nginx/conf.d/vless-panel.conf, 证书放在 /etc/vless-panel/certs/
server {
    listen 127.0.0.1:8446 ssl http2 proxy_protocol;
    server_name panel.example.com;

    # 从 stream 层的 PROXY protocol 取用户真实 IP
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/vless-panel/certs/fullchain.pem;
    ssl_certificate_key /etc/vless-panel/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;
    access_log /var/log/nginx/vless-panel.access.log;
    error_log  /var/log/nginx/vless-panel.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:PANEL_PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# 80 端口: 证书续期验证 + 其他请求跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# 再在 /etc/nginx/stream.d/ 的 SNI map 里加一行 (放在 default 之前):
#     panel.example.com     127.0.0.1:8446;
# 并在 panel.json 里设置 "secureCookie": true, "trustProxy": true, 然后 systemctl restart vless-panel
